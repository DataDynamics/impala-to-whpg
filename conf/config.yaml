# Impala 조회 / S3 조작 설정 (바로 돌려볼 수 있는 최소 예제)
#
# 이 파일은 저장소에 커밋되는 예제입니다. 실제 운영 값으로 고칠 때는 그대로 쓰지 말고
# conf/config.local.yaml 로 복사해서 쓰세요. *.local.yaml 은 .gitignore에 걸려 있습니다.
#
#     cp conf/config.yaml conf/config.local.yaml
#     bin/s3-ops --config conf/config.local.yaml ls s3://dw-stage/
#
# 비밀번호는 ${ENV_VAR} 로만 참조합니다. 이 파일에 직접 적으면 커밋될 수 있습니다.
# 사용할 수 있는 모든 옵션은 conf/config.example.yaml 을 보세요.

impala:
  host: impala.example.com
  port: 21050
  database: sales

  # LDAP 인증. impyla에서는 PLAIN이 사용자/비밀번호 인증(LDAP)을 뜻합니다.
  # (NOSASL = 인증 없음, GSSAPI = Kerberos)
  auth_mechanism: PLAIN
  user: ${IMPALA_USER}
  password: ${IMPALA_PASSWORD}

  # TLS. ca_cert를 지정해야 서버 인증서를 검증합니다.
  # 생략하면 통신은 암호화되지만 상대가 진짜 서버인지는 확인하지 않습니다.
  use_ssl: true
  ca_cert: /etc/ssl/certs/impala-ca.pem

  session_settings:
    MEM_LIMIT: 8g

# bin/s3-ops 가 --config 로 읽는 섹션입니다.
# bucket 은 s3:// 없이 키만 준 경우의 기본 버킷으로 쓰입니다.
s3:
  bucket: dw-stage
  region: ap-northeast-2
  # 자격증명을 적지 않으면 환경변수나 IAM 역할을 그대로 씁니다.
  # access_key_id: ${AWS_ACCESS_KEY_ID}
  # secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  # MinIO 등 S3 호환 스토리지를 쓸 때만 지정합니다.
  # client_endpoint_url: http://minio.example.com:9000
