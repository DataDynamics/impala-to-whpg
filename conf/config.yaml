impala:
  host: impala.example.com
  port: 21050
  database: default
  # LDAP 인증. impyla에서는 PLAIN이 사용자/비밀번호 인증(LDAP)을 뜻합니다.
  # (NOSASL = 인증 없음, GSSAPI = Kerberos)
  auth_mechanism: PLAIN
  user: ${IMPALA_USER}
  password: ${IMPALA_PASSWORD}

  # TLS. ca_cert를 지정해야 서버 인증서를 검증합니다.
  # 생략하면 통신은 암호화되지만 상대가 진짜 서버인지는 확인하지 않습니다.
  #
  # 상대 경로는 이 파일이 있는 conf/ 기준입니다. 아래 값은 conf/impala-ca.pem 을
  # 가리키므로, 인증서를 그 이름으로 conf/ 에 두면 됩니다.
  use_ssl: true
  ca_cert: impala-ca.pem

  session_settings:
    MEM_LIMIT: 8g

# bin/gp-query 가 접속할 Greenplum 입니다.
greenplum:
  host: greenplum.example.com
  port: 5432
  database: dw
  user: ${GP_USER:-etl}
  password: ${GP_PASSWORD}
  # 쿼리 전에 search_path 로 지정할 스키마입니다. 필요 없으면 지우세요.
  schema: staging

# bin/impala-query-to-csv 와 bin/gp-query 가 --query-file 에 이름만 줬을 때 .sql 을 찾는 곳입니다.
# 상대 경로는 이 파일이 있는 conf/ 기준이라 ../sql 은 저장소의 sql/ 을 가리킵니다.
sql:
  dir: ../sql

s3:
  bucket: sample
  region: ap-northeast-2
  access_key_id: ${AWS_ACCESS_KEY_ID}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  client_endpoint_url: http://minio.example.com:9000
