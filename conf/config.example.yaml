# 설정 예시 — 쓸 수 있는 옵션을 주석과 함께 나열한 참조 문서
#
# bin/ 아래 스크립트는 아무것도 지정하지 않으면 conf/config.yaml 을 읽는다.
# 이 파일은 참조용이라 자동으로 읽히지 않는다. 여기 값으로 돌려보려면
#     bin/s3-ops --config conf/config.example.yaml ls ...
# 처럼 직접 지정한다.
#
# 명령행 인자가 항상 이 파일보다 우선한다.
#
# ${ENV_VAR} 또는 ${ENV_VAR:-기본값} 은 실행 시점에 환경변수로 치환된다.
# 기본값 없이 참조한 변수가 정의되어 있지 않으면 그 항목만 건너뛰고 경고를 남긴다.

impala:
  host: impala.example.com
  port: 21050
  database: default
  # 인증 방식: NOSASL(인증 없음) | PLAIN(LDAP) | GSSAPI(Kerberos)
  auth_mechanism: NOSASL

  # TLS + LDAP 조합을 쓴다면 아래 네 줄을 함께 켠다 (conf/config.yaml 참고)
  # auth_mechanism: PLAIN
  # user: ${IMPALA_USER}
  # password: ${IMPALA_PASSWORD}
  # use_ssl: true
  #
  # ca_cert 의 상대 경로는 이 파일이 있는 conf/ 기준으로 푼다. 작업 디렉터리가
  # 아니므로 어디서 실행해도 같은 파일을 가리킨다. 절대 경로도 그대로 쓸 수 있다.
  # ca_cert: impala-ca.pem                     # → conf/impala-ca.pem
  # ca_cert: /etc/ssl/certs/impala-ca.pem      # 생략 시 인증서 검증 안 함

  # Kerberos라면
  # auth_mechanism: GSSAPI
  # kerberos_service_name: impala
  # use_ssl: true
  session_settings:
    MEM_LIMIT: 8g

# bin/gp-query 가 접속할 Greenplum.
greenplum:
  host: greenplum.example.com
  port: 5432
  database: dw
  user: ${GP_USER:-etl}
  password: ${GP_PASSWORD}

  # 쿼리 전에 search_path 로 지정할 스키마. --schema 로 덮어쓸 수 있다.
  schema: staging

  # sslmode: require            # libpq 값 그대로 (require, verify-full 등)
  # connect_timeout: 10

  # 쿼리 전에 실행할 SET 문. --session-sql 로 더 붙일 수 있다.
  session_sql:
    - SET statement_timeout = '30min'

# bin/impala-query-to-csv 와 bin/gp-query 가 --query-file 에 이름만 줬을 때 .sql 을 찾는 곳.
# 명령행 --sql-dir 로 덮어쓸 수 있다. 적지 않으면 저장소의 sql/ 을 쓴다.
#
# 상대 경로는 이 파일이 있는 디렉터리 기준으로 푼다. 작업 디렉터리가 아니므로
# 어디서 실행해도 같은 곳을 가리킨다. 절대 경로도 그대로 쓸 수 있다.
sql:
  dir: ../sql                     # conf/ 기준 → 저장소의 sql/
  # dir: /srv/etl/queries         # 절대 경로

# bin/s3-ops 가 --config 로 읽는 섹션.
# 여기 값은 명령행 인자(--bucket, --access-key, --region, --endpoint)로 덮을 수 있다.
s3:
  # s3:// 없이 키만 준 경우에 쓰는 기본 버킷
  bucket: dw-stage
  region: ap-northeast-2

  # 생략하면 환경변수나 IAM 역할 등 boto3 기본 자격증명 체인을 그대로 쓴다.
  # access_key_id: ${AWS_ACCESS_KEY_ID}
  # secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  # session_token: ${AWS_SESSION_TOKEN}

  # MinIO 등 S3 호환 스토리지를 쓸 때만 지정
  # client_endpoint_url: http://minio.example.com:9000
