# Impala → Greenplum 적재 설정 (바로 돌려볼 수 있는 최소 예제)
#
# 이 파일은 저장소에 커밋되는 예제입니다. 실제 운영 값으로 고칠 때는 그대로 쓰지 말고
# config.local.yaml 로 복사해서 쓰세요. *.local.yaml 은 .gitignore에 걸려 있습니다.
#
#     cp config.yaml config.local.yaml
#     python -m impala_to_greenplum --config config.local.yaml
#
# 비밀번호는 ${ENV_VAR} 로만 참조합니다. 이 파일에 직접 적으면 커밋될 수 있습니다.
# 사용할 수 있는 모든 옵션은 config.example.yaml 을 보세요.

impala:
  host: impala.example.com
  port: 21050
  database: sales
  # NOSASL(기본) | PLAIN(LDAP) | GSSAPI(Kerberos)
  auth_mechanism: NOSASL

greenplum:
  host: greenplum.example.com
  port: 5432
  database: dw
  user: ${GP_USER:-etl}
  password: ${GP_PASSWORD}
  schema: staging

# S3 스테이징. 세그먼트에 s3.conf 를 미리 배포해야 합니다.
# 준비 절차는 docs/s3_external_table.md 참고.
s3:
  bucket: dw-stage
  prefix: impala-to-greenplum
  endpoint: s3.ap-northeast-2.amazonaws.com
  region: ap-northeast-2
  gp_config: /home/gpadmin/s3.conf
  # 파일 수가 세그먼트 수 이상이 되도록 잡아야 모두 병렬로 읽습니다
  file_size_mb: 128

jobs:
  # 하루치 주문을 S3 경유로 적재하고, order_id 기준으로 기존 행을 갱신한다
  - query: |
      SELECT
        order_id,
        customer_id,
        order_dt,
        CAST(amount AS DECIMAL(18,2)) AS amount,
        status
      FROM sales.orders
      WHERE order_dt = '2026-08-01'
    target_table: orders
    mode: upsert
    key_columns: [order_id]
    distributed_by: [order_id]
    batch_size: 50000
    load_method: s3

  # 소량 테이블은 S3를 거치지 않고 COPY로 바로 밀어넣는 편이 빠르다
  - source_table: sales.customers
    target_table: customers
    mode: truncate
    load_method: copy
